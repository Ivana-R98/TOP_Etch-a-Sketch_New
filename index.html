<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch-a-Sketch</title>
    <script src="./main.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Etch-a-Sketch</h1>
    </header>
    <main>
        <div class="container-border">
            <div class="topBtns">
                <button class="btn" id="gridBtn">Grid</button>
                <button class="btn" id="colorBtn">Color</button>
                <button class="btn" id="rainbowBtn">Rainbow</button>
                <button class="btn" id="shadeBtn">Shade</button>
            </div>
            <div class="container"></div>
            <div class="bottomBtns">
                <button class="btn" id="eraserBtn">Eraser</button>
                <button class="btn" id="resetBtn">Reset</button>
            </div>
        </div>
    </main>
</body>
</html>
